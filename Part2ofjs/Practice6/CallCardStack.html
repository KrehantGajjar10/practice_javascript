<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Card Stack</title>

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CallCardStack.css" />
  </head>

  <body>
    <div class="form-container">
      <h2>New Call</h2>

      <form>
        <label>Image URL</label>
        <input type="text" placeholder="https://example.com/photo.jpg" />

        <label>Full Name</label>
        <input type="text" placeholder="Enter full name" />

        <label>Home Town</label>
        <input type="text" placeholder="Enter home town" />

        <label>Purpose</label>
        <input type="text" placeholder="e.g., Quick appointment note" />

        <label>Category</label>

        <label class="tag-checkbox">
          <input type="radio" name="category" value="emergency" />
          <span>Emergency</span>
        </label>

        <label class="tag-checkbox">
          <input type="radio" name="category" value="important" />
          <span>Important</span>
        </label>

        <label class="tag-checkbox">
          <input type="radio" name="category" value="urgent" />
          <span>Urgent</span>
        </label>

        <label class="tag-checkbox">
          <input type="radio" name="category" value="no-rush" />
          <span>No Rush</span>
        </label>

        <button class="submit-btn">Create Note</button>
      </form>

      <button class="closeForm">close</button>
    </div>

    <div class="note-container">
      <div class="left-icons">
        <button id="add-note">
          <i class="ri-add-line"></i>
        </button>

        <button id="upBtn">
          <i class="ri-arrow-up-line"></i>
        </button>

        <button id="downBtn">
          <i class="ri-arrow-down-line"></i>
        </button>
      </div>

      <div class="stack">
        <!-- Sample Card -->

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=200"
            alt="profile"
            class="avatar"
          />

          <h2>Emily Parker</h2>

          <div class="info">
            <span>Home town</span>
            <span>Chicago</span>
          </div>

          <div class="info">
            <span>Purpose</span>
            <span>Client Follow-up</span>
          </div>

          <div class="buttons">
            <button class="call"><i class="ri-phone-line"></i> Call</button>
            <button class="msg">Message</button>
          </div>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200"
            alt="profile"
            class="avatar"
          />

          <h2>Michael Brown</h2>

          <div class="info">
            <span>Home town</span>
            <span>Dallas</span>
          </div>

          <div class="info">
            <span>Purpose</span>
            <span>Project Discussion</span>
          </div>

          <div class="buttons">
            <button class="call"><i class="ri-phone-line"></i> Call</button>
            <button class="msg">Message</button>
          </div>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=200"
            alt="profile"
            class="avatar"
          />

          <h2>Sophia Wilson</h2>

          <div class="info">
            <span>Home town</span>
            <span>Seattle</span>
          </div>

          <div class="info">
            <span>Purpose</span>
            <span>Appointment Reminder</span>
          </div>

          <div class="buttons">
            <button class="call"><i class="ri-phone-line"></i> Call</button>
            <button class="msg">Message</button>
          </div>
        </div>
      </div>

      <div class="right-colors">
        <span class="dot black"></span>
        <span class="dot purple"></span>
        <span class="dot orange"></span>
        <span class="dot teal"></span>
      </div>
    </div>
  </body>
</html>
